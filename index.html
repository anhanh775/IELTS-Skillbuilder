<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Skill Builder (4.5+)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.11.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#f4f7fb;--ink:#1e2a3b;--mu:#64748b;--cd:#fff;--ln:#d9e2ef;--sh:0 6px 20px rgba(30,60,120,.08);--pill:#eaf1ff;--lr:#ea580c;--lrb:#fff1e6;--wr:#4f46e5;--wrb:#ecebff;--sp:#0891b2;--spb:#e1f5f9;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0f1624;--ink:#e8eefb;--mu:#93a3bd;--cd:#18223a;--ln:#26324d;--sh:0 6px 20px rgba(0,0,0,.35);--pill:#1d2d54;--lr:#fb923c;--lrb:#3a2616;--wr:#a5a0ff;--wrb:#25244d;--sp:#4dd0e8;--spb:#12323a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 1rem/1.6 "Plus Jakarta Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:1.5rem 1rem 4rem}
.hero{display:flex;align-items:center;gap:1rem;padding:1.5rem;border-radius:24px;background:#2563eb;color:#fff;box-shadow:0 8px 20px rgba(37,99,235,.22);margin-bottom:1.4rem}
.hi{flex:none;width:3.6rem;height:3.6rem;border-radius:18px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.9rem}
h1{font:800 clamp(1.6rem,5.5vw,2.5rem)/1.15 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:-.01em;margin:0}
.hs{margin:.3rem 0 0;color:rgba(255,255,255,.88);font-size:.95rem}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.9rem}
.t{--c:var(--mu);--cb:var(--pill);display:flex;flex-direction:column;gap:.55rem;min-height:9.5rem;padding:1rem;border-radius:22px;background:var(--cd);box-shadow:var(--sh);color:inherit;text-decoration:none;transition:transform .15s}
.t.lr{--c:var(--lr);--cb:var(--lrb)}.t.wr{--c:var(--wr);--cb:var(--wrb)}.t.sp{--c:var(--sp);--cb:var(--spb)}
.top{display:flex;justify-content:space-between;align-items:center}
.n{font-weight:800;font-size:1.7rem;line-height:1;color:var(--c)}
.ic{display:grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:12px;background:var(--cb);color:var(--c);font-size:1.3rem}
.nm{font-weight:700;font-size:.92rem;line-height:1.35}
.pl{margin-top:auto;align-self:flex-start;font-weight:700;font-size:.74rem;padding:.15rem .7rem;border-radius:99px;background:var(--pill);color:var(--mu)}
a.t .pl{background:var(--cb);color:var(--c)}
a.t:hover{transform:translateY(-3px)}
a.t:focus-visible{outline:3px solid var(--c);outline-offset:3px}
.t.soon{box-shadow:none;background:transparent;border:1.5px dashed var(--ln)}
.t.soon.named{box-shadow:var(--sh);background:var(--cd);border:0}
.t.soon:not(.named) .nm{color:var(--mu);font-weight:500}
@media (prefers-reduced-motion:reduce){.t{transition:none}a.t:hover{transform:none}}
</style>
</head>
<body>
<main>
<div class="hero"><div class="hi"><i class="ti ti-rocket" aria-hidden="true"></i></div><div><h1>IELTS Skill Builder (4.5+)</h1><p class="hs">30 short sessions. Pick a session to start.</p></div></div>
<ol class="grid" id="grid"></ol>
<noscript><p>Please turn on JavaScript to see the sessions.</p></noscript>
</main>
<script>
// To add a session: put its page in session-NN/index.html, then set href and title here.
// skill: lr = listening/reading, wr = writing, sp = speaking (sets colour and icon).
// An entry with no href is shown as “Coming soon”.
(function(){
var ICON={lr:"headphones",wr:"pencil",sp:"microphone"};
var S=[
 {title:"IELTS Short Listening & Reading Practice",skill:"lr"},
 {title:"IELTS Short Writing Practice",skill:"wr",href:"session-02/"},
 {title:"IELTS Short Speaking Practice",skill:"sp",href:"session-03/"}
];
var g=document.getElementById("grid");
for(var i=0;i<30;i++){
 var s=S[i]||{},li=document.createElement("li"),a=document.createElement(s.href?"a":"div");
 a.className="t"+(s.skill?" "+s.skill:"")+(s.href?"":" soon")+(s.title?" named":"");
 if(s.href)a.href=s.href;
 var hd=document.createElement("div");hd.className="top";
 var n=document.createElement("span");n.className="n";n.textContent=String(i+1).padStart(2,"0");hd.appendChild(n);
 if(s.skill){var ic=document.createElement("span");ic.className="ic";ic.innerHTML='<i class="ti ti-'+ICON[s.skill]+'" aria-hidden="true"></i>';hd.appendChild(ic)}
 var nm=document.createElement("span");nm.className="nm";nm.textContent=s.title||"Session "+(i+1);
 var pl=document.createElement("span");pl.className="pl";pl.textContent=s.href?"Start now":"Coming soon";
 a.append(hd,nm,pl);li.appendChild(a);g.appendChild(li);
}
})();
</script>
</body>
</html>
